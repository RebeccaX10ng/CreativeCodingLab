<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Public Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-auth-compat.js"></script>

    <style>
        /* 基础样式 */
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #96ffd2;
        }

        /* 视窗，这是我们能看到的区域 */
        #viewport {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 世界地图，一个巨大的容器，我们将在其中移动 */
        #world {
            position: absolute;
            /* 通过 transform 来移动整个世界，模拟镜头平移 */
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            /* 平滑过渡效果 */
        }

        /* 单个作品的样式 */
        .gallery-item {
            position: absolute;
            /* 使用绝对定位来放置作品 */
            width: 120px;
            height: 120px;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.3s ease;
            /* 鼠标悬停时的放大效果 */
        }

        .gallery-item:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        #audioPlayer {
            display: none;
        }

        #viewport {
            cursor: grab;
        }

        #viewport.is-dragging {
            cursor: grabbing;
        }
    </style>
</head>

<body>

    <div id="viewport">
        <div id="world">
        </div>
    </div>
    <div id="sideMenuBtn">&#9776;</div>
    <nav id="sideMenu" class="side-menu">
        <div class="side-menu-categories">
            <a href="public-gallery.html" class="side-menu-link">Public Gallery</a>
            <a href="my-creations.html" id="myCollectionsLink" class="side-menu-link">My Collections</a>
            <a href="select_a_template.html" class="side-menu-link">Create My Record</a>
        </div>
        <div id="authContainer" class="side-menu-bottom">
            <a href="#" class="side-menu-signin">Sign In</a>
        </div>
    </nav>
    <div id="controls">
        <button id="playBtn" class="btns">Play All</button>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // --- Firebase 初始化 ---
        const firebaseConfig = {
            apiKey: "AIzaSyBOTjmMPnN16vh6zd6TQ3MVV1I1fqCpQ2U",
            authDomain: "days-records.firebaseapp.com",
            projectId: "days-records",
            storageBucket: "days-records.firebasestorage.app",
            messagingSenderId: "454621890868",
            appId: "1:454621890868:web:9095c79739212ca4e3bd61",
            measurementId: "G-7ZKGPTRHPP"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        //global variables
        const viewport = document.getElementById('viewport');
        const world = document.getElementById('world');
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');

        let creations = [];
        let playlist = [];
        let isPlaying = false;


        let isDragging = false;
        let startX, startY;
        let worldX = 0, worldY = 0;
        let initialWorldX = 0, initialWorldY = 0;
        let scale = 1;

        //load and render public creations
        async function loadPublicCreations() {
            try {
                const querySnapshot = await db.collection("creations")
                    .where("isPublic", "==", true).get();

                const renderedCreations = [];

                querySnapshot.forEach(doc => {
                    const creation = { id: doc.id, ...doc.data() };
                    creations.push(creation);

                    if (creation.position) {
                        const item = document.createElement('img');
                        item.className = 'gallery-item';
                        item.src = creation.imageUrl;
                        item.alt = creation.albumName;
                        item.style.left = `${creation.position.x}px`;
                        item.style.top = `${creation.position.y}px`;
                        item.id = `item-${creation.id}`;
                        item.onclick = () => focusOnCreation(creation);
                        world.appendChild(item);

                        renderedCreations.push(creation);
                    }
                });

                if (renderedCreations.length > 0) {
                    // focus on the first creation initially
                    focusOnCreation(renderedCreations[0], false);
                }

            } catch (error) {
                console.error("Error loading creations:", error);
            }
        }

        //focus on a specific creation
        function focusOnCreation(creation, shouldPlayAudio = false) {
            if (!creation || !creation.position) return;

            //smooth move
            world.style.transition = 'transform 1.5s cubic-bezier(0.4, 0, 0.2, 1)';

            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            //upload position
            worldX = -creation.position.x + (viewportWidth / 2) - 60;
            worldY = -creation.position.y + (viewportHeight / 2) - 60;

            applyTransform();

            if (shouldPlayAudio && creation.audioUrl) {
                audioPlayer.src = creation.audioUrl;
                audioPlayer.play();
            }

        }

        // play control
        function togglePlayback() {
            if (isPlaying) {
                audioPlayer.pause();
                audioPlayer.currentTime = 0;
                isPlaying = false;
                playBtn.textContent = 'Play All';
            } else {
                playlist = creations.filter(c => c.audioUrl).sort(() => 0.5 - Math.random());
                if (playlist.length > 0) {
                    isPlaying = true;
                    playBtn.textContent = 'Stop';
                    playNext();
                } else {
                    alert("No public creations with audio found!");
                }
            }
        }

        // 4. 播放下一个音频 (有小幅修改)
        function playNext() {
            if (!isPlaying || playlist.length === 0) {
                isPlaying = false;
                playBtn.textContent = 'Play All';
                return;
            }
            const nextCreation = playlist.pop();
            // 聚焦到下一个作品，并告诉函数需要播放音频
            focusOnCreation(nextCreation, true);
        }

        // --- 【新】处理拖拽的函数 ---

        function onMouseDown(event) {
            isDragging = true;
            viewport.classList.add('is-dragging');
            startX = event.pageX;
            startY = event.pageY;
            initialWorldX = worldX;
            initialWorldY = worldY;
            world.style.transition = 'none';
        }

        function onMouseMove(event) {
            if (!isDragging) return;
            event.preventDefault();
            const dx = event.pageX - startX;
            const dy = event.pageY - startY;
            worldX = initialWorldX + dx;
            worldY = initialWorldY + dy;
            applyTransform();
        }
        function onMouseUp() {
            isDragging = false;
            viewport.classList.remove('is-dragging');
            world.style.transition = 'transform 1.5s cubic-bezier(0.4, 0, 0.2, 1)';
        }
        function onWheel(event) {
            event.preventDefault(); // 阻止页面默认的滚动行为
            const zoomIntensity = 0.1;
            const scrollDelta = event.deltaY < 0 ? 1 : -1; // 滚轮向上为1, 向下为-1

            // 获取鼠标在视窗内的坐标
            const mouseX = event.clientX;
            const mouseY = event.clientY;

            // 计算鼠标指向“世界”中的哪个点
            const worldPointX = (mouseX - worldX) / scale;
            const worldPointY = (mouseY - worldY) / scale;

            // 计算新的缩放比例，并限制在合理范围
            const newScale = scale * (1 + scrollDelta * zoomIntensity);
            scale = Math.max(0.25, Math.min(newScale, 4)); // 限制最小0.25倍，最大4倍

            // 计算新的世界坐标，以保持鼠标下的点位置不变
            worldX = mouseX - worldPointX * scale;
            worldY = mouseY - worldPointY * scale;

            // 应用新的变换
            applyTransform();
        }
        function applyTransform() {
            world.style.transform = `translate(${worldX}px, ${worldY}px) scale(${scale})`;
        }

        // --- 事件监听 ---
        playBtn.onclick = togglePlayback;
        audioPlayer.onended = playNext;
        // 【新】为视窗绑定鼠标事件
        viewport.addEventListener('mousedown', onMouseDown);
        viewport.addEventListener('mousemove', onMouseMove);
        viewport.addEventListener('mouseup', onMouseUp);
        viewport.addEventListener('mouseleave', onMouseUp); // 如果鼠标移出窗口，也停止拖动

        viewport.addEventListener('wheel', onWheel);
        // --- 启动 ---
        loadPublicCreations();

        //side menu
        const menuBtn = document.getElementById('sideMenuBtn');
        const sideMenu = document.getElementById('sideMenu');
        menuBtn.onclick = () => {
            sideMenu.classList.toggle('open');
        };
        // 点击菜单外部区域关闭菜单
        document.addEventListener('click', (e) => {
            if (!sideMenu.contains(e.target) && e.target !== menuBtn) {
                sideMenu.classList.remove('open');
            }
        });

        // --- 侧边栏登录/登出状态的逻辑 ---
        const auth = firebase.auth(); // 初始化认证服务

        auth.onAuthStateChanged((user) => {
            const authContainer = document.getElementById('authContainer');
            const myCollectionsLink = document.getElementById('myCollectionsLink');

            if (user) {
                // 用户已登录
                authContainer.innerHTML = `
                    <div class="side-menu-user">
                        <p>Welcome, ${user.displayName.split(' ')[0]}!</p>
                        <a href="#" id="signOutBtn" class="side-menu-signin">Sign Out</a>
                    </div>
                `;
                document.getElementById('signOutBtn').addEventListener('click', (e) => {
                    e.preventDefault();
                    auth.signOut();
                });
                myCollectionsLink.href = 'my-creations.html';
            } else {
                // 用户未登录
                authContainer.innerHTML = `
                    <a href="#" id="signInBtn" class="side-menu-signin">Sign In</a>
                `;
                document.getElementById('signInBtn').addEventListener('click', (e) => {
                    e.preventDefault();

                    const provider = new firebase.auth.GoogleAuthProvider();
                    auth.signInWithPopup(provider).catch(error => console.error(error));
                });
                myCollectionsLink.href = '#';
            }
        });
    </script>
</body>

</html>
